backend:
  name: github
  repo: fraterr/NevilleGoddardsVault
  branch: main
  automatic_deployments: true

site_url: https://nevillegoddardvault.com
display_url: https://nevillegoddardvault.com
media_folder: public/images/blog
public_folder: /images/blog

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - label: Description
        name: description
        widget: text
        hint: Shown in the blog index, search engines and the RSS feed (~160 characters).
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: "Optional, e.g.: practice, community, site-updates"
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: Drafts are saved in the repository but not published on the site.
      - { label: Body, name: body, widget: markdown }
